# Copy this job to the repository's .github/workflows directory when this
# standalone framework is promoted to a repository root.
name: playwright-testng
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright_testng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"
      - run: mvn test -Psmoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-testng-results
          path: |
            playwright_testng/target/allure-results
            playwright_testng/target/test-results
            playwright_testng/target/surefire-reports
